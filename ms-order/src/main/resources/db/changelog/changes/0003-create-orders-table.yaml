databaseChangeLog:
  - changeSet:
      id: create-orders-table
      author: yaliyev
      changes:
        - createTable:
            tableName: ORDERS
            schemaName: DELIVERY_SYSTEM
            remarks: Table for storing customer orders
            columns:
              - column:
                  name: ID
                  type: VARCHAR2(36)
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "UUID primary key"

              - column:
                  name: CUSTOMER_ID
                  type: NUMBER
                  constraints:
                    nullable: false
                  remarks: "Reference to USERS table"

              - column:
                  name: TOTAL_AMOUNT
                  type: NUMBER(10, 2)
                  constraints:
                    nullable: false
                  remarks: "Order total amount"

              - column:
                  name: STATUS
                  type: VARCHAR2(20)
                  constraints:
                    nullable: false
                  remarks: "Order status"

              - column:
                  name: CREATED_AT
                  type: TIMESTAMP(6)
                  defaultValueComputed: "SYSTIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Record creation timestamp"

              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP(6)
                  defaultValueComputed: "SYSTIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Record update timestamp"

        - addForeignKeyConstraint:
            baseTableName: ORDERS
            baseColumnNames: CUSTOMER_ID
            constraintName: ORDERS_CUSTOMER_FK
            referencedTableName: USERS
            referencedColumnNames: ID
            deferrable: false
            initiallyDeferred: false
            validate: true

        - createIndex:
            indexName: IDX_ORDERS_CUSTOMER_ID
            tableName: ORDERS
            columns:
              - column:
                  name: CUSTOMER_ID