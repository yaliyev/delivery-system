databaseChangeLog:
  - changeSet:
      id: create-wallets-table
      author: yaliyev
      changes:
        - createTable:
            tableName: WALLETS
            schemaName: DELIVERY_SYSTEM
            remarks: Table for storing user wallets
            columns:
              - column:
                  name: ID
                  type: NUMBER
                  defaultValueComputed: "DELIVERY_SYSTEM.WALLETS_SEQ.NEXTVAL"
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: Auto-generated primary key

              - column:
                  name: USER_ID
                  type: NUMBER
                  constraints:
                    nullable: false
                  remarks: Reference to USERS table

              - column:
                  name: BALANCE
                  type: NUMBER(19, 4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: Current wallet balance

              - column:
                  name: CURRENCY
                  type: VARCHAR2(10)
                  constraints:
                    nullable: false
                  remarks: Currency code (ISO format)

              - column:
                  name: STATUS
                  type: VARCHAR2(20)
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false
                  remarks: Wallet status

              - column:
                  name: CREATED_AT
                  type: TIMESTAMP(6)
                  defaultValueComputed: "SYSTIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: Creation timestamp

              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP(6)
                  defaultValueComputed: "SYSTIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: Last update timestamp

              - column:
                  name: VERSION
                  type: NUMBER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: Optimistic lock version

        - addForeignKeyConstraint:
            baseTableName: WALLETS
            baseColumnNames: USER_ID
            constraintName: FK_WALLETS_USER_ID
            referencedTableName: USERS
            referencedColumnNames: ID
            deferrable: false
            initiallyDeferred: false
            validate: true

        - createIndex:
            indexName: IDX_WALLETS_USER_ID
            tableName: WALLETS
            columns:
              - column:
                  name: USER_ID
            remarks: Improves queries filtering by user